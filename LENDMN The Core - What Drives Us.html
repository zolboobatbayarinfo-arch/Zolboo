<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>LendMN All-Hands 2026 - The Masterpiece</title>

<style>
/* --- 1. SETUP & BACKGROUND ANIMATION --- */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020617; color:#fff; font-family:'Inter', system-ui, sans-serif; overflow: hidden;}

#bg-stars {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
  z-index: -1; overflow: hidden;
}
.star {
  position: absolute; background: #fff; border-radius: 50%; opacity: 0.3;
  animation: moveStar linear infinite;
}
@keyframes moveStar {
  from { transform: translateY(0); }
  to { transform: translateY(-100vh); }
}

/* --- 2. ENERGY RIPPLE ANIMATION --- */
@keyframes energyWave {
  0% { transform: scale(1); opacity: 0.7; stroke-width: 2px; }
  100% { transform: scale(8); opacity: 0; stroke-width: 0.5px; }
}
.pulse-wave {
  position: absolute; top: 500px; left: 500px; width: 140px; height: 140px;
  margin-left: -70px; margin-top: -70px;
  border: 1px solid #F5B800; border-radius: 50%;
  pointer-events: none; opacity: 0;
  animation: energyWave 5s cubic-bezier(0.165, 0.84, 0.44, 1) infinite;
}
.wave-2 { animation-delay: 1.5s; border-color: rgba(245, 184, 0, 0.5); }
.wave-3 { animation-delay: 3s; border-color: rgba(245, 184, 0, 0.3); }

/* --- 3. MAIN WORLD & SVG --- */
#pz{width: 100vw; height: 100vh; overflow:hidden; position:relative;}
#stage{width:100%; height:100%; overflow:hidden; position:relative; background:transparent; cursor:default}
#world{position:absolute; transform-origin:0 0; transition:transform 0.85s cubic-bezier(0.4, 0, 0.2, 1); will-change:transform}
#world svg{display:block; width:1000px; height:1000px;}

.rband{ transition: all 0.4s ease; stroke-width: 1.5px; }
.active-ring { animation: glowPulse 3s ease-in-out infinite; }
@keyframes glowPulse {
  0%, 100% { stroke-opacity: 0.3; filter: drop-shadow(0 0 2px currentColor); }
  50% { stroke-opacity: 1; filter: drop-shadow(0 0 15px currentColor); }
}

.arc-label{opacity:0.65; transition:opacity 0.35s; pointer-events:none; font-size:11.5px; font-weight:700; letter-spacing: 0.05em; text-transform:uppercase;}
.arc-label.visible{opacity:1 !important; font-size: 14px;}

/* --- 4. PERFECT CENTER TEXT OVERLAY (Fixed positioning bug) --- */
#center-text-overlay {
  position: absolute;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  z-index: 25;
  width: 600px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1), top 0.85s cubic-bezier(0.4, 0, 0.2, 1), left 0.85s cubic-bezier(0.4, 0, 0.2, 1);
}
#ct-title {
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -1px;
  line-height: 1.1;
  transition: color 0.4s, font-size 0.4s;
  text-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
#ct-subtitle {
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-top: 8px;
  transition: color 0.4s, font-size 0.4s;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

/* --- 5. INFO PANEL (GLASSMORPHISM) --- */
#info-panel{
  position:absolute; top:0; right:0; width:440px; height:100%;
  display:flex; align-items:center; padding:32px 24px;
  pointer-events:none; opacity:0;
  transition:all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  transform:translateX(50px); z-index: 30;
}
#info-panel.show{opacity:1; pointer-events:auto; transform:translateX(0)}
#info-card {
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 32px; padding: 44px 36px; width: 100%;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(30px);
}
.ic-eye{font-size:11px; font-weight: 700; letter-spacing:0.18em; text-transform:uppercase; color:#38bdf8; margin-bottom:24px; display:flex; align-items:center;}
.ic-eye::before { content: ''; width: 8px; height: 8px; background: currentColor; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 10px currentColor; }
.ic-title{font-size:28px; font-weight:900; color:#ffffff; line-height:1.2; margin-bottom:24px; letter-spacing: -1px;}
.ic-body{font-size:16px; color:#cbd5e1; line-height:1.85; margin-bottom:32px}
.ic-tag{font-size:11px; font-weight:800; padding:6px 14px; border-radius:20px; margin-right:8px; display:inline-block; border: 1px solid rgba(255,255,255,0.1);}
.ic-sep{border:none; border-top:1px solid rgba(255,255,255,0.1); margin:0 0 24px}
.ic-note{font-size:14.5px; color:#64748b; line-height:1.75; font-style: italic;}

#back-btn{position:absolute; top:32px; left:32px; background:rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius:14px; padding:12px 28px; font-size:14px; font-weight:700; color:#fff; cursor:pointer; transition:all 0.2s; display:none; z-index:40; backdrop-filter: blur(10px); letter-spacing: 0.05em;}
#back-btn:hover{background:rgba(255, 255, 255, 0.15); border-color: #38bdf8; transform: scale(1.05);}
#hint-txt{position:absolute; bottom:30px; left:50%; transform: translateX(-50%); font-size:12px; color:#334155; pointer-events:none; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 800;}

/* MOBILE RESPONSIVE MEDIA QUERIES */
@media (max-width: 768px) {
  #center-text-overlay { width: 280px; }
  #info-panel { top: auto; bottom: 0; width: 100%; height: 350px; padding: 12px; transform: translateY(50px); }
  #info-panel.show { transform: translateY(0); }
  #info-card { border-radius: 30px 30px 0 0; padding: 28px; }
  .ic-title { font-size: 24px; }
}
</style>
</head>

<script>
/* 1. STAR FIELD GENERATOR */
const bg = document.getElementById('bg-stars');
for(let i=0; i<100; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  const size = Math.random() * 2.5 + 'px';
  star.style.width = size; star.style.height = size;
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.animationDuration = (Math.random() * 60 + 40) + 's';
  star.style.animationDelay = -(Math.random() * 60) + 's';
  bg.appendChild(star);
}

const RING_COLORS = { 1:'#F5B800', 2:'#9d4edd', 3:'#e01e5a', 4:'#f77f00', 5:'#00b4d8', 6:'#ffffff', 7:'#ff7300' };
const BG_COLORS = { 1:'rgba(245,184,0,0.3)', 2:'rgba(123,63,160,0.35)', 3:'rgba(201,33,90,0.35)', 4:'rgba(244,123,32,0.35)', 5:'rgba(0,180,160,0.35)', 6:'rgba(255,255,255,0.15)', 7:'rgba(255,115,0,0.25)' };

const CORE_DYNAMIC_TEXT = [
  { t1: "LendMN", t2: "ЭКОСИСТЕМ" },
  { t1: "VISION", t2: "БИДНИЙ АЛСЫН ХАРАА" },
  { t1: "STRENGTH", t2: "ХАМТЫН ХҮЧ" },
  { t1: "SME OS", t2: "ИННОВАЦИ БА СУУРЬ" },
  { t1: "TRUST", t2: "ИТГЭЛЦЭЛ" },
  { t1: "PARTNERS", t2: "ХАМТРАГЧИД" },
  { t1: "INCLUSION", t2: "САНХҮҮГИЙН ХҮРТЭЭМЖ" },
  { t1: "LENDMN", t2: "БИД НЭГ БҮХЭЛ" }
];

const DATA = [null,
  { eye:'1-р давхарга · ЦӨМ', title:'Бидний Алсын Хараа', body:'Биднийг нэгтгэх чиглүүлэгч од. Бидний өглөө бүр тэмүүлэх зорилго, хамтын эрмэлзэл эндээс эхэлнэ. Энэхүү цөм тодорхой байх нь бидний амжилтын үндэс юм.', tags:[{t:'Shared Vision',c:'#7B2D00',b:'#FEF0C0'},{t:'Зорилго',c:'#7B2D00',b:'#FEF0C0'}], note:'Цөм хүчтэй бөгөөд тодорхой байх тусам гадагшаа тэлэх алхам бүр зөв зүгт чиглэнэ.' },
  { eye:'2-р давхарга · БАГ ХАМТ ОЛОН', title:'Хамтын хүч', body:'Алсын харааг амжилтад хүргэх цорын ганц хөдөлгүүр. Бүх баг хамт олон маань харилцан уялдаатайгаар нэгэн хэмнэлээр урагшлах нь бидний хамтын хүч чадал юм.', tags:[{t:'Нэг Хамт Олон',c:'#3D1460',b:'#EFE0FF'},{t:'Team Spirit',c:'#3D1460',b:'#EFE0FF'}], note:'Бид нэг гэр бүл байж чадсанаар дараагийн бүх тойргууд оршин тогтнож байна.' },
  { eye:'3-р давхарга · ТЕХНОЛОГИ', title:'Инноваци & SME OS', body:'Бидний хамтын ажиллагаанаас Монголын финтек салбарын шилдэг ноу-хау төрөн гардаг. Үүний үргэлжлэл болох бидний дараагийн технологийн шийдлүүд бол Agentic AI Engine систем болон ЖДҮ эрхлэгчдийн өдөр тутмын үйлдлийн систем (SME OS) юм.', tags:[{t:'SME OS',c:'#6B0028',b:'#FFE0EC'},{t:'AI Engine',c:'#6B0028',b:'#FFE0EC'}], note:'SME OS бол бидний технологийн ноу-хауг зах зээлд үнэмлэхүй ялалтад хүргэх гол систем.' },
  { eye:'4-р давхарга · ХАРИЛЦАГЧИД', title:'Итгэлцэл', body:'10,000 гаруй иргэд, 12,000 гаруй ЖДҮ эрхлэгчдийн өдөр тутмын амьдрал, бизнесийн урсгалыг бид алхам тутамд нь хөнгөвчилж байна. Харилцагчдтай үүсгэсэн бат бөх итгэлцэл дээр бид маргаашийн илүү ухаалаг санхүүгийн ирээдүйг бүтээж байна.', tags:[{t:'Итгэлцэл',c:'#7B2800',b:'#FFE8CC'},{t:'Харилцагч',c:'#7B2800',b:'#FFE8CC'}], note:'Харилцагчийн итгэл бол бидний өсөлтийг тэтгэгч гол хүч.' },
  { eye:'5-р давхарга · ТҮНШҮҮД', title:'Хамтрагчид', body:'Банкууд, олон улсын DFI хөрөнгө оруулагчид болон стратегийн нийлүүлэгчид. Манай дотоод баг, технологи, харилцагчийн бааз хэр хүчтэй байна, гадаад түншлэл, экосистемийн цар хүрээ тэр чинээгээрээ тэлнэ.', tags:[{t:'Түншлэл',c:'#003D36',b:'#CCFAF3'},{t:'Ecosystem',c:'#003D36',b:'#CCFAF3'}], note:'Хамтран ажилласнаар бид санхүүгийн шинэ стандартыг зах зээлд тогтоодог.' },
  { eye:'6-р давхарга · НИЙГЭМ', title:'Санхүүгийн Хүртээмж', body:'Бидний хийж буй алхам бүрийн эцсийн үр нөлөө. Монголын жижиг дунд бизнесийг дижиталжуулж, санхүүгийн хүртээмжийг нэмэгдүүлснээр улс орныхоо эдийн засгийг илүү эрүүл болгож байна.', tags:[{t:'Хүртээмж',c:'#0f172a',b:'#f1f5f9'},{t:'Эдийн засаг',c:'#0f172a',b:'#f1f5f9'}], note:'Цөмөөс эхэлсэн долгион бүх нийгэм, экосистемд хүрч буй эцсийн бодит үр дүн.' },
  { eye:'7-р давхарга · LENDMN', title:'Бид Нэг Бүхэл', body:'Энэ бүх давхарга, алсын хараа, хамт олон,技術, харилцагчдыг нэгтгэн зангидаж буй зүйл бол LENDMN. Бид бол зүгээр нэг апп биш, бид бол Монголын финтекийй түүхийг бичиж буй нэгдмэл, хамгийн хүчирхэг экосистем.', tags:[{t:'LendMN',c:'#082f49',b:'#bae6fd'},{t:'Бид Нэг Бүхэл',c:'#082f49',b:'#bae6fd'}], note:'Энэ бол бидний хамтын түүх. Бид Нэг Бүхэл. БИД БОЛ LENDMN!' }
];

const FOCUSES = [null, {cx:500,cy:500,r:80},{cx:500,cy:500,r:145},{cx:500,cy:500,r:210},{cx:500,cy:500,r:275},{cx:500,cy:500,r:340},{cx:500,cy:500,r:410},{cx:500,cy:500,r:470}];

let cur = 0;
const world = document.getElementById('world');
const stage = document.getElementById('stage');
const panel = document.getElementById('info-panel');
const backBtn = document.getElementById('back-btn');

function applyRingState(activeIdx) {
  [1,2,3,4,5,6,7].forEach(i => {
    const b = document.getElementById('b'+i);
    const lbl = document.getElementById('lbl'+i);
    b.classList.remove('active-ring');
    if (activeIdx === 0) {
      b.style.fill = RING_COLORS[i]; b.style.fillOpacity = i === 1 ? '0.85' : '0.12';
      b.style.stroke = RING_COLORS[i]; b.style.strokeOpacity = '0.3';
      if (lbl) { lbl.classList.remove('visible'); lbl.style.opacity = "0.65"; }
    } else if (i === activeIdx) {
      b.style.fill = BG_COLORS[i]; b.style.fillOpacity = '1';
      b.style.stroke = RING_COLORS[i]; b.style.strokeOpacity = '1';
      b.classList.add('active-ring');
      if (lbl) lbl.classList.add('visible');
    } else {
      b.style.fill = '#1e293b'; b.style.fillOpacity = '0.04';
      b.style.stroke = '#334155'; b.style.strokeOpacity = '0.1';
      if (lbl) { lbl.classList.remove('visible'); lbl.style.opacity = "0.08"; }
    }
  });

  // VECTOR COHESION SCALING FOR OVERLAY
  const ctTitle = document.getElementById('ct-title');
  const ctSubtitle = document.getElementById('ct-subtitle');
  
  ctTitle.textContent = CORE_DYNAMIC_TEXT[activeIdx].t1;
  ctSubtitle.textContent = CORE_DYNAMIC_TEXT[activeIdx].t2;
  
  if (activeIdx === 0) {
    ctTitle.style.fontSize = "26px"; ctTitle.style.color = "#040814";
    ctSubtitle.style.fontSize = "11px"; ctSubtitle.style.color = "#040814";
    ctSubtitle.style.marginTop = "4px";
  } else if (activeIdx === 1) {
    ctTitle.style.fontSize = "38px"; ctTitle.style.color = "#040814";
    ctSubtitle.style.fontSize = "13px"; ctSubtitle.style.color = "#040814";
    ctSubtitle.style.marginTop = "6px";
  } else if (activeIdx === 7) {
    ctTitle.style.fontSize = "76px"; ctTitle.style.color = "#ff7300";
    ctSubtitle.style.fontSize = "22px"; ctSubtitle.style.color = "#ffffff";
    ctSubtitle.style.marginTop = "12px";
  } else {
    ctTitle.style.fontSize = "40px"; ctTitle.style.color = RING_COLORS[activeIdx];
    ctSubtitle.style.fontSize = "15px"; ctSubtitle.style.color = "#ffffff";
    ctSubtitle.style.marginTop = "8px";
  }
}

function computeTx(idx) {
  const sw = stage.offsetWidth, sh = stage.offsetHeight;
  const isMobile = window.innerWidth <= 768;
  if (!idx) { const sc = Math.min(sw * 0.9, sh * 0.9) / 1000; return {sc, tx: sw/2 - 500*sc, ty: sh/2 - 500*sc}; }
  const f = FOCUSES[idx];
  const panelW = isMobile ? 0 : 440, panelH = isMobile ? 350 : 0; 
  const availW = sw - panelW - (isMobile ? 0 : 30), availH = sh - panelH - (isMobile ? 20 : 0);
  const sc = Math.min(availW * 0.88, availH * 0.88) / (f.r * 2);
  const clamped = Math.min(sc, 6.5);
  return {sc:clamped, tx: (isMobile ? sw/2 : availW/2) - f.cx*clamped, ty: (isMobile ? (sh-panelH)/2 : sh/2) - f.cy*clamped};
}

function showPanel(idx) {
  const d = DATA[idx]; if (!d) return;
  document.getElementById('ic-eye-txt').textContent = d.eye;
  document.getElementById('ic-title').innerHTML = d.title;
  document.getElementById('ic-body').innerHTML = d.body;
  document.getElementById('ic-note').textContent = d.note;
  const tg = document.getElementById('ic-tags'); tg.innerHTML='';
  d.tags.forEach(t=>{const sp=document.createElement('span');sp.className='ic-tag';sp.textContent=t.t;sp.style.background=t.b;sp.style.color=t.c;tg.appendChild(sp);});
  panel.classList.add('show');
}

function goSlide(idx){
  hidePanel(); cur=idx; backBtn.style.display=idx?'block':'none';
  const {sc,tx,ty}=computeTx(idx); world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  
  // DYNAMIC MILLIMETER CENTER ANCHORING LOGIC
  const overlay = document.getElementById('center-text-overlay');
  overlay.style.left = (tx + 500 * sc) + 'px';
  overlay.style.top = (ty + 500 * sc) + 'px';

  applyRingState(idx); if(idx>0) setTimeout(()=>showPanel(idx), 450); 
}

function hidePanel(){panel.classList.remove('show');}
function reset(){goSlide(0);}
function nextSlide(){goSlide((cur+1)%8);}
function prevSlide(){goSlide((cur-1+8)%8);}

[1,2,3,4,5,6,7].forEach(idx=>{ document.getElementById('h'+idx).addEventListener('click',e=>{ e.stopPropagation(); goSlide(idx); }); });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); nextSlide(); } if(e.key==='ArrowLeft') { e.preventDefault(); prevSlide(); } if(e.key==='Escape') reset(); });
window.addEventListener('resize', () => goSlide(cur));
goSlide(0);
</script>
</body>
